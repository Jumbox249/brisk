name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: Brisk-win-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Brisk-Setup
          path: out/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Brisk-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          # Attach the build to the release you created (so it stays under your name);
          # create one only if there isn't one yet.
          $setup = Get-ChildItem out/*.exe | Select-Object -First 1 -ExpandProperty FullName
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "${{ github.ref_name }}" $zip $setup --clobber }
          else { gh release create "${{ github.ref_name }}" $zip $setup --generate-notes }
